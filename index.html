<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>cat-ching Expense Tracker</title>
    
    <!-- PWA Installation Support -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#fff8e7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cat-main': '#fff8e7',
                        'cat-sub': '#fcfcf6',
                        'cat-accent': '#cfb291',
                        'cat-dark': '#5c4838',
                        'cat-soft': '#e8dacb',
                        'cat-pink': '#f4dcd0',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Chart.js for Visualizations -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            background-color: #fff8e7;
            color: #5c4838;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        
        .cat-card {
            background-color: #fcfcf6;
            border: 1.5px solid #e8dacb;
            box-shadow: 0 4px 12px rgba(207, 178, 145, 0.12);
        }

        /* Hide scrollbars */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes subtle-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .pulse-subtle {
            animation: subtle-pulse 2.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex justify-center bg-[#fff8e7]">

    <div id="app" class="w-full max-w-md min-h-screen flex flex-col justify-between relative pb-20 select-none">
        
        <!-- CLEAN TOP HEADER (No App Name, No App Icon, No Test SMS Button) -->
        <header class="p-4 pt-5 flex justify-between items-center bg-[#fff8e7] sticky top-0 z-20 border-b border-[#e8dacb]/40">
            <!-- Active Listener Status Badge -->
            <button onclick="openNotificationSetupModal()" class="flex items-center gap-2 bg-[#fcfcf6] px-3 py-1.5 rounded-xl border border-[#e8dacb] shadow-sm hover:border-[#cfb291] transition">
                <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block pulse-subtle"></span>
                <span id="sync-status-text" class="text-xs text-[#5c4838] font-bold">Auto-Sync On</span>
                <i data-lucide="settings" class="w-3.5 h-3.5 text-[#8c7a6b] ml-1"></i>
            </button>

            <!-- Current Active Account Quick Switcher or Date Info -->
            <div class="text-xs text-[#8c7a6b] font-medium bg-[#fcfcf6] px-3 py-1.5 rounded-xl border border-[#e8dacb]">
                <span id="live-time-display">Oct 17, 2026</span>
            </div>
        </header>

        <!-- MAIN CONTENT VIEW HOLDER -->
        <main id="main-content" class="px-4 py-3 flex-1">
            <!-- Dynamic Page Content Injected Here -->
        </main>

        <!-- BOTTOM NAVIGATION BAR -->
        <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-[#fcfcf6] border-t border-[#e8dacb] px-8 py-3 flex justify-around items-center z-30 shadow-lg">
            <button id="nav-overview" onclick="switchPage('overview')" class="flex flex-col items-center gap-1 text-[#cfb291] transition">
                <div class="p-2 rounded-xl bg-[#fff8e7] border border-[#e8dacb]">
                    <i data-lucide="wallet" class="w-5 h-5"></i>
                </div>
                <span class="text-[11px] font-bold">Overview</span>
            </button>

            <button id="nav-category" onclick="switchPage('category')" class="flex flex-col items-center gap-1 text-[#8c7a6b] transition">
                <div class="p-2 rounded-xl bg-transparent">
                    <i data-lucide="pie-chart" class="w-5 h-5"></i>
                </div>
                <span class="text-[11px] font-medium">Category</span>
            </button>
        </nav>

        <!-- MODAL CONTAINERS -->
        <div id="modal-container"></div>
    </div>

        const CATEGORY_ICON_OPTIONS = [

        // Available Months Selector Options
        const MONTH_OPTIONS = [
            { id: '2026-10', name: 'October 2026 (This Month)' },
            { id: '2026-09', name: 'September 2026 (Last Month)' },
            { id: '2026-08', name: 'August 2026' },
            { id: '2026-07', name: 'July 2026' },
            { id: '2026-06', name: 'June 2026' }
        ];

        function getTotalBalance() {
            return appData.accounts.reduce((acc, cur) => acc + cur.balance, 0);
        }

        function getMonthlyExpenses() {
            return appData.transactions
                .filter(t => t.type === 'expense' && t.date.startsWith(appData.selectedMonthYear))
                .reduce((acc, cur) => acc + cur.amount, 0);
        }

        function getMonthlyIncome() {
            return appData.transactions
                .filter(t => t.type === 'income' && t.date.startsWith(appData.selectedMonthYear))
                .reduce((acc, cur) => acc + cur.amount, 0);
        }

        function getDaysRemainingInMonth() {
            const parts = appData.selectedMonthYear.split('-');
            const year = parseInt(parts[0]);
            const month = parseInt(parts[1]);
            const totalDays = new Date(year, month, 0).getDate();
            const now = new Date();
            
            if (now.getFullYear() > year || (now.getFullYear() === year && (now.getMonth() + 1) > month)) {
                return 1;
            }
            const currentDay = (now.getFullYear() === year && (now.getMonth() + 1) === month) ? now.getDate() : 1;
            return Math.max(1, totalDays - currentDay + 1);
        }

        function getDailyRecommendedBalance() {
            const totalBalance = getTotalBalance();
            const daysLeft = getDaysRemainingInMonth();
            return (totalBalance / daysLeft).toFixed(2);
        }

        function renderOverview() {
            const totalBal = getTotalBalance();
            const totalExp = getMonthlyExpenses();
            const dailyBal = getDailyRecommendedBalance();
            const daysLeft = getDaysRemainingInMonth();
            const expPercentage = appData.monthlyBudget > 0 ? Math.min(100, (totalExp / appData.monthlyBudget) * 100).toFixed(1) : 0;

            const filteredTx = appData.transactions.filter(t => t.date.startsWith(appData.selectedMonthYear));

            const html = `
                <!-- MONTH SELECTOR -->

                    </div>

                    <div class="grid grid-cols-3 gap-2 py-2 border-t border-[#e8dacb]/60 text-center">
                        <div>
                            <span class="text-[10px] text-[#8c7a6b] font-medium block">Spent</span>
                            <span class="text-xs font-bold text-rose-600">RM ${totalExp.toFixed(2)}</span>
                        </div>

                            <span class="text-xs font-bold text-emerald-700">RM ${dailyBal}</span>
                        </div>
                        <div class="relative">
                            <div class="flex items-center justify-center gap-0.5">
                                <span class="text-[10px] text-[#8c7a6b] font-medium">Budget Target</span>
                                <button onclick="openSetBudgetModal()" class="text-[#cfb291] hover:text-[#5c4838]">
                                    <i data-lucide="edit-3" class="w-3 h-3"></i>
                                </button>
                            </div>

                    <!-- Budget Progress Bar -->

                        </div>
                    </div>
                </div>

                <!-- ACCOUNTS & WALLETS SECTION -->
                <div class="mb-5">
                    <div class="flex justify-between items-center mb-2.5">
                        <h2 class="font-bold text-xs text-[#5c4838] flex items-center gap-1.5 uppercase tracking-wider">
                            <i data-lucide="credit-card" class="w-4 h-4 text-[#cfb291]"></i> Banks & Wallets
                        </h2>
                        <button onclick="openAddAccountModal()" class="text-[11px] bg-[#fff8e7] border border-[#cfb291] text-[#5c4838] px-2.5 py-1 rounded-xl font-semibold flex items-center gap-1 hover:bg-[#cfb291] hover:text-white transition">

                        <div class="flex gap-2 text-[10px] font-bold">
                            <span class="text-rose-600 bg-rose-50 px-2 py-0.5 rounded-lg border border-rose-100">Spent RM ${totalExp.toFixed(2)}</span>
                            <span class="text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-lg border border-emerald-100">Income RM ${getMonthlyIncome().toFixed(2)}</span>

                    </div>

                    <!-- Transactions List -->
                    <div class="space-y-2">
                        ${filteredTx.length === 0 ? `

                        ` : filteredTx.map(tx => {
                            const catInfo = appData.customCategories[tx.category] || { icon: 'more-horizontal', color: '#c4b9a5' };

                            return `

        function toggleExpandTx(id) {
            expandedTxId = expandedTxId === id ? null : id;

        function renderCategoryPage() {
            const expenses = appData.transactions.filter(t => t.type === 'expense' && t.date.startsWith(appData.selectedMonthYear));

            const categorySums = {};
            Object.keys(appData.customCategories).forEach(cat => categorySums[cat] = 0);

                        Expenses Breakdown
                    </h3>
                    <div class="w-44 h-44 mx-auto relative flex items-center justify-center">
                        <canvas id="categoryChart"></canvas>
                    </div>
                </div>

                <!-- CATEGORIES DETAILED LIST -->
                <div class="space-y-3 mb-6">
                    ${Object.keys(appData.customCategories).map(catName => {
                        const amount = categorySums[catName] || 0;
                        const percentage = totalExp > 0 ? ((amount / totalExp) * 100).toFixed(1) : '0.0';
                        const catInfo = appData.customCategories[catName];
                        const catItems = expenses.filter(t => t.category === catName);

                        return `

                const ctx = document.getElementById('categoryChart')?.getContext('2d');
                if (ctx) {
                    const labels = Object.keys(appData.customCategories);
                    const dataValues = labels.map(l => categorySums[l]);
                    const bgColors = labels.map(l => appData.customCategories[l].color);

                    new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: labels,
                            datasets: [{
                                data: dataValues.every(v => v === 0) ? [1] : dataValues,
                                backgroundColor: dataValues.every(v => v === 0) ? ['#e8dacb'] : bgColors,
                                borderWidth: 2,
                                borderColor: '#fcfcf6'

                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false }
                            },
                            cutout: '65%'
                        }
                    });
                }
            }, 50);

        function triggerSimulatedBankAlert() {
            if (!appData.autoSyncEnabled) {
                alert("Please enable Auto-Sync first!");
                return;
            }

            closeModal();

            const sampleAmounts = [15.50, 32.00, 88.00, 12.00, 6.50];
            const sampleItems = ["Iced Coffee & Toast", "Groceries at Watsons", "Uniqlo T-Shirt", "Grab Ride", "Rice & Drinks"];
            const sampleCats = ["Food & Drink", "Groceries", "Shopping & Clothes", "Travel & Fuel", "Food & Drink"];
            
            const randIdx = Math.floor(Math.random() * sampleAmounts.length);
            const amount = sampleAmounts[randIdx];
            const detail = sampleItems[randIdx];
            const category = sampleCats[randIdx];
            const targetAcc = appData.accounts[0] ? appData.accounts[0].name : "Touch 'n Go eWallet";

            const toastHtml = `
                <div id="sim-toast" class="fixed top-3 left-1/2 -translate-x-1/2 w-11/12 max-w-md bg-[#5c4838] text-white p-3.5 rounded-2xl shadow-xl z-50 flex items-center justify-between border border-[#cfb291]">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-xl bg-[#cfb291] flex items-center justify-center text-white">
                            <i data-lucide="bell" class="w-4 h-4"></i>
                        </div>
                        <div>
                            <span class="text-[10px] text-[#e8dacb] font-semibold block uppercase">${targetAcc} Alert Detected</span>
                            <p class="text-xs font-bold">Auto-Logged: RM ${amount.toFixed(2)} (${detail})</p>
                        </div>
                    </div>
                    <span class="text-[10px] bg-emerald-500 text-white px-2 py-0.5 rounded-md font-bold">Saved</span>
                </div>
            `;

            const toastContainer = document.createElement('div');
            toastContainer.innerHTML = toastHtml;
            document.body.appendChild(toastContainer);
            lucide.createIcons();

            const acc = appData.accounts.find(a => a.name === targetAcc);
            if (acc) acc.balance -= amount;

            const now = new Date();
            appData.transactions.unshift({
                id: Date.now(),
                type: 'expense',
                category: category,
                amount: amount,
                account: targetAcc,
                time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                date: "2026-10-17",
                details: "[Auto Notification Reader] " + detail
            });

            if (currentPage === 'overview') renderOverview();
            else renderCategoryPage();

            setTimeout(() => {
                toastContainer.remove();
            }, 3500);
        }

        function openEditAccountModal(accId) {
            const acc = appData.accounts.find(a => a.id === accId);

            const html = `

                    <div class="cat-card w-full max-w-xs rounded-2xl p-5 border border-[#e8dacb] bg-[#fcfcf6]">

            const newBal = parseFloat(document.getElementById('edit-acc-balance').value);
            const acc = appData.accounts.find(a => a.id === accId);
            if (acc && !isNaN(newBal)) {

        function changeMonth(monthVal) {
            appData.selectedMonthYear = monthVal;
            if (currentPage === 'overview') {
                renderOverview();
            } else {
                renderCategoryPage();
            }
        }

        function switchPage(page) {
            currentPage = page;
            const overviewBtn = document.getElementById('nav-overview');
            const categoryBtn = document.getElementById('nav-category');

            if (page === 'overview') {
                overviewBtn.className = "flex flex-col items-center gap-1 text-[#cfb291] transition";
                overviewBtn.querySelector('div').className = "p-2 rounded-xl bg-[#fff8e7] border border-[#e8dacb]";
                
                categoryBtn.className = "flex flex-col items-center gap-1 text-[#8c7a6b] transition";
                categoryBtn.querySelector('div').className = "p-2 rounded-xl bg-transparent";
                
                renderOverview();
            } else if (page === 'category') {
                categoryBtn.className = "flex flex-col items-center gap-1 text-[#cfb291] transition";
                categoryBtn.querySelector('div').className = "p-2 rounded-xl bg-[#fff8e7] border border-[#e8dacb]";
                
                overviewBtn.className = "flex flex-col items-center gap-1 text-[#8c7a6b] transition";
                overviewBtn.querySelector('div').className = "p-2 rounded-xl bg-transparent";
                
                renderCategoryPage();
            }
        }

        function saveTransaction(type) {
            const accName = document.getElementById('tx-acc-select').value;
            const amount = parseFloat(document.getElementById('tx-amount-input').value);
            const category = document.getElementById('tx-cat-select').value;
            const details = document.getElementById('tx-details-input').value;

            if (isNaN(amount) || amount <= 0) return;

            const acc = appData.accounts.find(a => a.name === accName);
            if (acc) {
                if (type === 'expense') acc.balance -= amount;
                else acc.balance += amount;
            }

            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            appData.transactions.unshift({
                id: Date.now(),
                type: type,
                category: category,
                amount: amount,
                account: accName,
                time: timeStr,
                date: "2026-10-17",
                details: details
            });

            closeModal();
            renderOverview();
        }

        function deleteTransaction(id) {
            const tx = appData.transactions.find(t => t.id === id);
            if (tx) {
                const acc = appData.accounts.find(a => a.name === tx.account);
                if (acc) {
                    if (tx.type === 'expense') acc.balance += tx.amount;
                    else acc.balance -= tx.amount;
                }
                appData.transactions = appData.transactions.filter(t => t.id !== id);
                renderOverview();
            }
        }

        // Initialize App
        window.onload = function() {
            renderOverview();
        };
    </script>

    <!-- Register the PWA service worker -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js")
            .catch(error => console.error("Service worker registration failed:", error));
        });
      }
    </script>
